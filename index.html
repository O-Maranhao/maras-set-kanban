<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maras-Set-Kanban</title>

  <!-- List of wallpaper images, used by the inline script below and by script.js -->
  <script src="wallpapers.js"></script>

  <!-- Applies the saved theme (or the system one) before the first paint, so there is no flash -->
  <script>
    try {
      const saved = localStorage.getItem("maras-set-kanban-theme");
      document.documentElement.dataset.theme =
        saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch {}

    // Same for the saved wallpaper: an id from wallpapers.js, a gradient preset or an uploaded image (data URL).
    // An unknown value (removed file, old preset) is cleared and the default stays.
    try {
      const wallpaper = localStorage.getItem("maras-set-kanban-wallpaper");
      const image = WALLPAPERS.find((w) => w.id === wallpaper);
      if (wallpaper && wallpaper.startsWith("data:image/")) {
        document.documentElement.style.setProperty("--wallpaper-custom", `url("${wallpaper}")`);
        document.documentElement.dataset.wallpaper = "custom";
      } else if (image) {
        const url = image.file.split("/").map(encodeURIComponent).join("/");
        document.documentElement.style.setProperty("--wallpaper", `url("${url}")`);
        document.documentElement.dataset.wallpaper = image.id;
      } else if (["sunset", "forest", "graphite"].includes(wallpaper)) {
        document.documentElement.dataset.wallpaper = wallpaper;
      } else if (wallpaper) {
        localStorage.removeItem("maras-set-kanban-wallpaper");
      }
    } catch {}
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar: project title, theme toggle, wallpaper picker and button to add a new task -->
  <header class="board-header">
    <h1>Maras-Set-Kanban</h1>
    <div class="header-actions">
      <button class="theme-toggle" type="button"></button>
      <button class="wallpaper-toggle" type="button" aria-haspopup="dialog" aria-expanded="false">Wallpaper</button>
      <button class="new-task-btn">+ New Task</button>
    </div>
  </header>

  <!-- Task form (create and edit), hidden by default -->
  <dialog class="task-form-dialog">
    <form class="task-form" method="dialog">
      <h2>New Task</h2>

      <label for="task-title-input">Title</label>
      <input type="text" id="task-title-input" required>

      <label for="task-priority-input">Priority (MoSCoW)</label>
      <select id="task-priority-input">
        <option value="must">Must</option>
        <option value="should">Should</option>
        <option value="could">Could</option>
        <option value="wont">Won't</option>
      </select>

      <label for="task-date-input">Due date</label>
      <input type="date" id="task-date-input" required>

      <div class="task-form-actions">
        <button type="button" class="task-form-cancel">Cancel</button>
        <button type="submit" class="task-form-submit">Add Task</button>
      </div>
    </form>
  </dialog>

  <!-- Wallpaper picker, hidden by default -->
  <dialog class="wallpaper-dialog" aria-labelledby="wallpaper-dialog-title">
    <h2 id="wallpaper-dialog-title">Wallpaper</h2>

    <!-- Image thumbnails from wallpapers.js are added here by script.js, before the gradients -->
    <div class="wallpaper-options" role="group" aria-label="Wallpapers">
      <button type="button" class="wallpaper-option" data-wallpaper="sunset" aria-pressed="false">
        <span class="wallpaper-swatch"></span>Sunset
      </button>
      <button type="button" class="wallpaper-option" data-wallpaper="forest" aria-pressed="false">
        <span class="wallpaper-swatch"></span>Forest
      </button>
      <button type="button" class="wallpaper-option" data-wallpaper="graphite" aria-pressed="false">
        <span class="wallpaper-swatch"></span>Graphite
      </button>
      <button type="button" class="wallpaper-option" data-wallpaper="custom" aria-pressed="false" hidden>
        <span class="wallpaper-swatch"></span>Your image
      </button>
    </div>

    <input type="file" class="wallpaper-file-input" accept="image/*" hidden>
    <button type="button" class="wallpaper-upload-btn">Upload image</button>

    <p class="wallpaper-error" role="alert" hidden></p>

    <div class="wallpaper-actions">
      <button type="button" class="wallpaper-reset-btn">Reset to default</button>
      <button type="button" class="wallpaper-close-btn">Done</button>
    </div>
  </dialog>

  <!-- MoSCoW filter -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="must">Must</button>
    <button class="filter-btn" data-filter="should">Should</button>
    <button class="filter-btn" data-filter="could">Could</button>
    <button class="filter-btn" data-filter="wont">Won't</button>
  </div>

  <!-- Main board: holds the 3 fixed columns. Cards are rendered by script.js -->
  <main class="board">

    <!-- Column 1: tasks not started yet -->
    <section class="column" data-column="todo">
      <div class="column-header">
        <h2>To Do</h2>
        <span class="counter">0</span>
      </div>
      <div class="task-list"></div>
    </section>

    <!-- Column 2: tasks in progress -->
    <section class="column" data-column="doing">
      <div class="column-header">
        <h2>Doing</h2>
        <span class="counter">0</span>
      </div>
      <div class="task-list"></div>
    </section>

    <!-- Column 3: completed tasks -->
    <section class="column" data-column="done">
      <div class="column-header">
        <h2>Done</h2>
        <span class="counter">0</span>
      </div>
      <div class="task-list"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
